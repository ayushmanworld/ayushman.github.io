name: ayushman-prod

services:
  # ─────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector
  # ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayushman_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ayushman_internal
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'

  # ─────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ayushman_redis_prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - ayushman_internal
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  # ─────────────────────────────────────────────────
  # Meilisearch
  # ─────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: ayushman_meilisearch_prod
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
      MEILI_LOG_LEVEL: warn
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - ayushman_internal
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '3'

  # ─────────────────────────────────────────────────
  # NestJS API
  # ─────────────────────────────────────────────────
  api:
    image: ghcr.io/ayushman/api:${APP_VERSION:-latest}
    container_name: ayushman_api_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ayushman_internal
      - ayushman_external
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/api/v1/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'

  # ─────────────────────────────────────────────────
  # Next.js Web
  # ─────────────────────────────────────────────────
  web:
    image: ghcr.io/ayushman/web:${APP_VERSION:-latest}
    container_name: ayushman_web_prod
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      SENTRY_DSN: ${SENTRY_DSN}
    depends_on:
      - api
    networks:
      - ayushman_internal
      - ayushman_external
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'

  # ─────────────────────────────────────────────────
  # Nginx — Reverse Proxy
  # ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ayushman_nginx_prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - web
      - api
    networks:
      - ayushman_external
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '10'

volumes:
  postgres_data:
    name: ayushman_postgres_data_prod
  redis_data:
    name: ayushman_redis_data_prod
  meilisearch_data:
    name: ayushman_meilisearch_data_prod
  nginx_logs:
    name: ayushman_nginx_logs_prod

networks:
  ayushman_internal:
    name: ayushman_internal_prod
    driver: bridge
    internal: true
  ayushman_external:
    name: ayushman_external_prod
    driver: bridge
