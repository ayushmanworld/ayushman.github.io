global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: ayushman
    environment: production

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  # NestJS API metrics (via /api/v1/metrics endpoint — added in Phase 10)
  - job_name: ayushman-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: [ayushman-api:4000]
    scrape_interval: 30s

  # Node exporter — host metrics
  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  # PostgreSQL exporter
  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  # Redis exporter
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
