global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

templates:
  - /etc/alertmanager/templates/*.tmpl

route:
  group_by: [alertname, cluster, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-critical

  routes:
    - match:
        severity: critical
      receiver: slack-critical
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: slack-warning
      repeat_interval: 4h

receivers:
  - name: slack-critical
    slack_configs:
      - channel: '#ayushman-alerts-critical'
        title: '🚨 CRITICAL — {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          {{ end }}
        send_resolved: true

  - name: slack-warning
    slack_configs:
      - channel: '#ayushman-alerts'
        title: '⚠️ WARNING — {{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: [alertname, cluster]
