version: '3.9'

services:
  # ── PostgreSQL with pgvector ──────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayushman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ayushman
      POSTGRES_USER: ayushman
      POSTGRES_PASSWORD: ayushman_dev_2026
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayushman']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ayushman-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Meilisearch ────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7
    container_name: ayushman-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ayushman_meili_dev_key
      MEILI_NO_ANALYTICS: 'true'
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── NestJS Backend ─────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend.dev
    container_name: ayushman-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ayushman:ayushman_dev_2026@postgres:5432/ayushman
      REDIS_URL: redis://redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ayushman_meili_dev_key
      NODE_ENV: development
      PORT: 4000
    env_file:
      - ../../backend/.env
    ports:
      - '4000:4000'
    volumes:
      - ../../backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    command: npm run start:dev

  # ── Next.js Frontend ───────────────────────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infrastructure/docker/Dockerfile.frontend.dev
    container_name: ayushman-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000/api/v1
      NODE_ENV: development
    env_file:
      - ../../frontend/.env.local
    ports:
      - '3000:3000'
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

  # ── Mailpit (local email testing) ─────────────
  mailpit:
    image: axllent/mailpit
    container_name: ayushman-mailpit
    restart: unless-stopped
    ports:
      - '8025:8025'    # UI
      - '1025:1025'    # SMTP

  # ── Adminer (DB GUI) ───────────────────────────
  adminer:
    image: adminer
    container_name: ayushman-adminer
    restart: unless-stopped
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data:
  meili_data:

networks:
  default:
    name: ayushman-network
