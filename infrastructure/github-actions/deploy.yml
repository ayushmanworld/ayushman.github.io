name: Ayushman — CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────
  # 1. LINT & TYPE CHECK
  # ─────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run type-check

      - name: Lint backend
        working-directory: backend
        run: npm run lint

  # ─────────────────────────────────────
  # 2. TEST
  # ─────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ayushman_test
          POSTGRES_USER: ayushman
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install & migrate DB
        working-directory: database
        env:
          DATABASE_URL: postgresql://ayushman:test_password@localhost:5432/ayushman_test
        run: |
          npm ci
          npx prisma migrate deploy

      - name: Test backend
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ayushman:test_password@localhost:5432/ayushman_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-jwt-secret
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test -- --passWithNoTests

      - name: Test frontend
        working-directory: frontend
        run: npm run test -- --passWithNoTests

  # ─────────────────────────────────────
  # 3. BUILD DOCKER IMAGES
  # ─────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infrastructure/docker/Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infrastructure/docker/Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RAZORPAY_KEY=${{ secrets.RAZORPAY_KEY_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────
  # 4. DEPLOY TO STAGING
  # ─────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: Deploy to staging ECS
        run: |
          echo "Deploying to staging..."
          # aws ecs update-service --cluster ayushman-staging --service ayushman-backend --force-new-deployment
          # aws ecs update-service --cluster ayushman-staging --service ayushman-frontend --force-new-deployment

      - name: Run DB migrations (staging)
        run: |
          echo "Running migrations on staging..."
          # npx prisma migrate deploy

      - name: Smoke test staging
        run: |
          sleep 30
          curl -f https://staging.ayushman.world/api/v1/health || exit 1
          echo "✅ Staging health check passed"

  # ─────────────────────────────────────
  # 5. DEPLOY TO PRODUCTION
  # ─────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Deploy backend to AWS ECS
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
        run: |
          echo "Deploying backend to production ECS..."
          # aws ecs update-service --cluster ayushman-prod --service ayushman-backend --force-new-deployment

      - name: Deploy frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Deploying frontend to Vercel..."
          # npx vercel --prod --token=$VERCEL_TOKEN

      - name: Run DB migrations (production)
        run: |
          echo "Running production migrations..."

      - name: Smoke test production
        run: |
          sleep 60
          curl -f https://ayushman.world/api/v1/health || exit 1
          echo "✅ Production health check passed"

      - name: Notify on success
        if: success()
        run: |
          echo "🚀 Ayushman deployed to production successfully!"

      - name: Notify on failure
        if: failure()
        run: |
          echo "🚨 Production deployment FAILED! Investigate immediately."
