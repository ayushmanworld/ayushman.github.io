name: ayushman-dev

services:
  # ─────────────────────────────────────────────────
  # PostgreSQL 16 with pgvector extension
  # ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ayushman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ayushman_dev}
      POSTGRES_USER: ${POSTGRES_USER:-ayushman}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayushman_dev_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ayushman} -d ${POSTGRES_DB:-ayushman_dev}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - ayushman_network

  # ─────────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ayushman_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - ayushman_network

  # ─────────────────────────────────────────────────
  # Meilisearch — Full-text Search
  # ─────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.9
    container_name: ayushman_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-ayushman_meili_dev_master_key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
      MEILI_LOG_LEVEL: warn
    ports:
      - '${MEILISEARCH_PORT:-7700}:7700'
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ayushman_network

  # ─────────────────────────────────────────────────
  # Mailpit — Local Email Testing
  # ─────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: ayushman_mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit_data:/data
    networks:
      - ayushman_network

  # ─────────────────────────────────────────────────
  # Adminer — Database GUI
  # ─────────────────────────────────────────────────
  adminer:
    image: adminer:4-standalone
    container_name: ayushman_adminer
    restart: unless-stopped
    environment:
      ADMINER_DESIGN: dracula
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ayushman_network

volumes:
  postgres_data:
    name: ayushman_postgres_data
  redis_data:
    name: ayushman_redis_data
  meilisearch_data:
    name: ayushman_meilisearch_data
  mailpit_data:
    name: ayushman_mailpit_data

networks:
  ayushman_network:
    name: ayushman_network
    driver: bridge
